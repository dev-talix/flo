name: CodeQL

on:
  push:
    branches: [main]
    # A PR scan already analyzes the merge result, so a main push only
    # refreshes the Security tab and the base for the next PR comparison.
    # Release, docs, and test-only merges have nothing new to scan. Lockfile
    # bumps are covered here, since their PRs skip the scan.
    paths:
      - "Sources/**"
      - "Package.swift"
      - "Package.resolved"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main]
    # Only app sources. Release, docs, test-only, and Dependabot lockfile PRs
    # skip the scan; the main push after merge still analyzes dependency
    # bumps.
    paths:
      - "Sources/**"
      - "Package.swift"
      - ".github/workflows/codeql.yml"
  schedule:
    # Weekly, so newly published queries reach existing code without a push.
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Swift
    # Swift analysis has to build the code, and this is an AppKit app.
    # Stays on GitHub's runner: the repo is public, so these minutes are free,
    # and CodeQL is by far the longest job.
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      security-events: write
      actions: read
      contents: read
    env:
      # The CodeQL tracer runs traced steps under Rosetta, and this SwiftPM
      # then defaults to an x86_64 build in a separate .build directory. That
      # recompiled and extracted every dependency (~40 minutes). Pinning the
      # triple keeps the dependency prebuild and the traced build identical.
      SWIFT_TRIPLE: arm64-apple-macosx
    steps:
      - uses: actions/checkout@v7

      - name: Identify Swift toolchain
        id: toolchain
        shell: bash
        run: |
          sw_vers -productVersion > "$RUNNER_TEMP/codeql-toolchain.txt"
          xcodebuild -version >> "$RUNNER_TEMP/codeql-toolchain.txt"
          swift --version >> "$RUNNER_TEMP/codeql-toolchain.txt"
          fingerprint=$(shasum -a 256 "$RUNNER_TEMP/codeql-toolchain.txt" | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM dependencies
        id: dependencies
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
          # This namespace contains dependency builds only. Never restore the
          # old full-app cache, which could hide unchanged files from CodeQL.
          # v2: the rename to flo moved the checkout path. v3: pinned triple.
          key: ${{ runner.os }}-${{ runner.arch }}-codeql-deps-v3-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-codeql-deps-v3-${{ steps.toolchain.outputs.fingerprint }}-

      - name: Resolve SwiftPM dependencies
        run: swift package resolve

      - name: Build SwiftPM dependencies
        run: |
          swift build --triple "$SWIFT_TRIPLE" --target WhisperKit
          swift build --triple "$SWIFT_TRIPLE" --target FluidAudio

      # Save before the app builds so even an unchanged app is compiled under
      # CodeQL on the next run. Sparkle is a resolved binary dependency.
      # PRs restore main's cache but never save their own. A PR-scoped cache
      # is ~1.25 GB that no other ref can use.
      - name: Save SwiftPM dependencies
        if: github.event_name != 'pull_request' && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
          queries: security-and-quality

      - name: Build
        run: swift build --triple "$SWIFT_TRIPLE"

      - name: Perform analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
