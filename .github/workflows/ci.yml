name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs write access to the repository.
permissions:
  contents: read

# A newer push to the same PR makes the older run pointless. Main pushes
# always finish so every main commit keeps a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    # Same SDK the release job ships with, so FoundationModels code paths and
    # SDK-dependent warnings show up here first.
    runs-on: blacksmith-6vcpu-macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Restore SwiftPM cache
        id: swiftpm-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.swiftpm
            .build
          # Bump the version when a restored .build goes stale. Repo renames
          # move the checkout path and break the old cache (v2: walkie, v3: flo,
          # v4: macos-15 to macos-26 toolchain).
          key: ${{ runner.os }}-swiftpm-v4-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-v4-

      - name: Lint shell scripts
        run: |
          set -euo pipefail
          bash -n scripts/*.sh
          # Non-ASCII in these scripts is not cosmetic. An ellipsis directly
          # after "$OUT" was parsed into the variable NAME under the runner's
          # C locale, so `set -u` aborted the release build while the same
          # script ran fine in a UTF-8 shell locally.
          #
          # perl, not grep: BSD grep (what macOS ships) does not understand
          # \x escapes in a bracket expression and silently matches almost
          # every line, so a grep-based version of this check passed locally
          # against GNU/ugrep and then failed CI on a clean tree.
          OFFENDERS="$(perl -ne 'print "$ARGV:$.: $_" if /[^\x00-\x7F]/' scripts/*.sh)"
          if [[ -n "$OFFENDERS" ]]; then
            echo "$OFFENDERS"
            echo "error: non-ASCII characters found in shell scripts (see above)" >&2
            exit 1
          fi
          echo "scripts are ASCII-clean"

      - name: Test release contract
        run: |
          swift package resolve
          bash Tests/ReleaseContractTests.sh
          python3 Tests/LocalAppIdleTests.py

      - name: Build
        run: swift build

      - name: Test
        run: |
          swift test
          python3 Tests/TranscribeCLITests.py
          python3 -B Tests/CaptureFailureBoundaryTests.py
          python3 -B Tests/CommandAbandonmentBoundaryTests.py

      # Only main saves. PR caches are scoped to their own ref, so each
      # Dependabot PR would otherwise store another ~800 MB copy that nothing
      # else can restore. PRs restore main's cache instead.
      - name: Save SwiftPM cache
        if: github.ref == 'refs/heads/main' && steps.swiftpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.swiftpm
            .build
          key: ${{ steps.swiftpm-cache.outputs.cache-primary-key }}
